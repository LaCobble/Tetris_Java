# Fast checks on every pull request and on main, on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Required files
        run: |
          for f in README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "::error file=$f::$f is missing"; exit 1; }
          done

      # Zulu "jdk+fx" bundles JavaFX, which the game needs (the repository has no pom.xml).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          java-package: jdk+fx

      - name: Compile
        run: javac -encoding UTF-8 -d out $(find Tetris/src/main/java -name '*.java' ! -name module-info.java)

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --no-banner --redact
